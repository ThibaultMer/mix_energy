repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-yaml # Validates YAML files for syntax errors.
  - id: check-toml # Validates TOML files for syntax errors.
  - id: end-of-file-fixer # Ensures files end with a newline.
  - id: trailing-whitespace # Removes trailing whitespace from files.
  - id: check-added-large-files # Checks that no large files (>500kb by default) have been committed.
- repo: local
  hooks:
    #- id: nbstripout
    #name: Strip Jupyter notebook output (nbstripout)
    #entry: nbstripout
    #language: system
    #files: .*

  - id: codespell ingest_dbt
    name: Check spelling with codespell
    entry: sh -c 'cd ingest_dbt && poetry run codespell markdown && cd ..'
    types: [markdown]
    language: system

  - id: codespell predict
    name: Check spelling with codespell
    entry: sh -c 'cd predict && poetry run codespell markdown && cd ..'
    types: [markdown]
    language: system

  - id: codespell fastapi
    name: Check spelling with codespell
    entry: sh -c 'cd fastapi && poetry run codespell markdown && cd ..'
    types: [markdown]
    language: system

    # - id: safety
    #  name: safety vulnerability check
    #  entry: poetry run safety scan
    #  language: system

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.9.1 # Change this if a new version is out.
  hooks:
  # Apply Ruff linting fixes.
    - id: ruff
      name: ruff fix # We can add arbitrary names to our hooks
      args: [--fix]
      types_or: [python, pyi] # Only scan .py files (and not jupyter notebooks)

  # Run the formatter.
    - id: ruff-format
      name: ruff format
      types_or: [python, pyi] # Only format .py files (and not jupyter notebooks)

  # Run the linter one last time to check for remaining issues.
    - id: ruff
      name: ruff check
  #args: [--output-format concise] # Makes the ruff check output more legible.
      types_or: [python, pyi] # Only scan .py files (and not jupyter notebooks)
