[project]
name = "mix-energy"
version = "0.1.0"
description = ""
authors = [
    {name = "ThibaultMer",email = "merville.thibault@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pandas (>=3.0.1,<4.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "requests (>=2.33.0,<3.0.0)",
]

[tool.poetry]
packages = [{include = "mix_energy", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
docs = [
    "mkdocs (>=1.6.1,<2.0.0)"
]
dbt = [
    "dbt-core (>=1.11.7,<2.0.0)",
    "dbt-bigquery (>=1.11.1,<2.0.0)"
]
