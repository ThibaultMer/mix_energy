
models:
  - name: stg_air_quality_paris
    description: Indices de qualité de l'air pour la ville de Paris
    columns:
      - name: insee_code
        description: >
          "{{ doc('french_region') }}"
      - name: date_maj
        description: Date et heure de la mise à jour
      - name: date_ech
        description: Date de valeur de l'indice TU
      - name: date_dif
        description: Date de diffusion de l'indice TU
      - name: code_qual
        description: >
          Indice de qualité
          "{{ doc('airquality_indice') }}"
      - name: code_zone
        description: Code commune INSEE
      - name: code_no2
        description: >
         Indice de NO2
         "{{ doc('airquality_indice') }}"
      - name: code_so2
        description: >
          Indice de SO2
          "{{ doc('airquality_indice') }}"
      - name: code_o3
        description: >
          Indice de O3 (Ozone)
          "{{ doc('airquality_indice') }}"
      - name: code_pm10
        description: >
          PM10, Les particules fines inférieures à 10 micromètres
          "{{ doc('airquality_indice') }}"
      - name: code_pm25
        description: >
          PM25, Les particules fines inférieures à 2,5 micromètres
          "{{ doc('airquality_indice') }}"

