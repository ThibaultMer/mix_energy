models:
  - name: stg_meteo_paris
    description: Informations météo pour la ville de Paris
    columns:
      - name: date_m
        description: Date considérée
      - name: day_time
        description: Période de la journée (Matin/Après-midi/Soir)
      - name: mean_temp_2m
        description: Moyenne de la température moyenne à 2m du sol en °C
      - name: mean_rel_hum_2m
        description: Moyenne du taux d'humidité relative à 2m du sol (%)
      - name: mean_wind_speed_10m
        description: Moyenne de la vitesse du vent à 10m au dessus du sol (km/h)
      - name: mean_evapo
        description: Moyenne du taux d'évaporation (mm)

