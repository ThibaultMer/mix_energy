[project]
name = "mix-energy-front-streamlit"
version = "0.1.0"
description = "Streamlit frontend for Mix Energy dashboards"
requires-python = ">=3.11,<4.0"
dependencies = [
    "streamlit>=1.44.1,<2.0.0",
    "plotly>=6.0.1,<7.0.0",
    "pandas>=2.2.3,<3.0.0",
    "requests>=2.32.3,<3.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "streamlit-autorefresh>=1.0.1,<2.0.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
